services:
  - type: web
    name: research-blueprint-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: SESSION_TTL_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: https://research-blueprint-ai.vercel.app
      - key: TRUSTED_HOSTS
        value: research-blueprint-backend.onrender.com
      - key: APP_URL
        value: https://research-blueprint-ai.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
